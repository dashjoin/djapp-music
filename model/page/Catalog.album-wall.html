<html>
<head>
  <style>
    #wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 8px; }
    .album { aspect-ratio: 1; border-radius: 12px; padding: 12px; color: #fff; text-decoration: none;
             display: flex; flex-direction: column; justify-content: flex-end;
             box-shadow: 0 4px 12px rgba(0,0,0,.2); transition: transform .15s; }
    .album:hover { transform: scale(1.05); }
    .album b { font-size: 14px; } .album span { font-size: 12px; opacity: .85; }
  </style>
  <script>
    // note: no JS template literals here - Dashjoin uses the dollar-brace syntax for its own templating
    (async () => {
      const res = await fetch("/rest/database/query/chinook/album-wall", {
        method: "POST", body: "{}",
        headers: { "Authorization": localStorage.getItem("auth-token"), "Content-Type": "application/json" }
      });
      const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
      const wall = document.getElementById("wall");
      for (const a of await res.json()) {
        const h = hue(a["Album.title"]), tile = document.createElement("a");
        tile.className = "album";
        tile.href = "#/chinook/Album/" + a["Album.id"];
        tile.style.background = "linear-gradient(135deg, hsl(" + h + ",70%,45%), hsl(" + (h + 60) + ",70%,25%))";
        tile.innerHTML = "<b></b><span></span>";
        tile.querySelector("b").textContent = a["Album.title"];
        tile.querySelector("span").textContent = a["Artist.artist"];
        wall.appendChild(tile);
      }
    })();
  </script>
</head>
<body><div id="wall"></div></body>
</html>
